name: Kittygram CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend_tests:
    name: Backend tests and Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Check code with Ruff
        run: ruff check backend --select E4,E7,E9,F --exclude "*/migrations/*"

      - name: Run Django tests
        working-directory: backend
        env:
          SECRET_KEY: github-actions-test-key
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: python manage.py test

  frontend_tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run React tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --passWithNoTests

  build_and_push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs:
      - backend_tests
      - frontend_tests

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: quflijj/kittygram_backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: quflijj/kittygram_frontend:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          push: true
          tags: quflijj/kittygram_gateway:
          
      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=✅ Kittygram CI/CD успешно завершён! Тесты пройдены, Docker-образы опубликованы. https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"